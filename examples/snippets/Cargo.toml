[package]
name = "snippets"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "eventster"
path = "src/eventster.rs"

[[bin]]
name = "env_browser"
path = "src/env_browser.rs"

[[bin]]
name = "property_collector"
path = "src/property_collector.rs"

[[bin]]
name = "perf_metrics"
path = "src/perf_metrics.rs"

[[bin]]
name = "mac_monitor"
path = "src/mac_monitor.rs"

[[bin]]
name = "dynamic_property_fetch"
path = "src/dynamic_property_fetch.rs"

[[bin]]
name = "root_objects"
path = "src/root_objects.rs"

[[bin]]
name = "vm_ip"
path = "src/vm_ip.rs"

[[bin]]
name = "vm_rename"
path = "src/vm_rename.rs"

[[bin]]
name = "vm_toggle_wol"
path = "src/vm_toggle_wol.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
utils = { version = "0.1", path = "../utils" }
tokio = {  version = "1.44", features = ["macros"]}
vim_rs = { version = "0.4", path = "../../vim_rs", features = ["defaults"] }
miniserde = "0.1"
dotenvy = "0.15"

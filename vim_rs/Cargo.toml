[package]
name = "vim_rs"
version = "0.4.4"
edition = "2021"
authors = ["Kiril Karaatanasov <karaatanasov@gmail.com>"]
license = "Apache-2.0"
description = "Rust Bindings for the VMware by Broadcom vCenter VI JSON API"
readme = "../README.md"
repository = "https://github.com/noclue/vim_rs"
homepage = "https://github.com/noclue/vim_rs"
documentation = "https://docs.rs/vim_rs"
keywords = ["vi-json", "vim", "bindings", "vcenter", "vmware"]
categories = ["api-bindings", "network-programming"]
exclude = ["target/*", "**/*.rs.bk"]

[features]
defaults = []
xml = ["dep:quick-xml", "reqwest/cookies"]
# Compatibility layer for producers that emit malformed SOAP payloads
# (notably `govc vcsim`, which omits required fields such as
# `OptionDef.optionType` inside `HostConfigInfo.optionDef`).
#
# Off by default. When enabled, client-internal XML deserialization drops
# elements whose `build()` fails instead of propagating the error, letting
# the enclosing `Option<Vec<…>>` / `Option<…>` absorb the drop.
# See `vim_rs::xml::de::DeserializeOptions::tolerate_build_errors` for the
# exact semantics and for the corresponding opt-in entry points
# (`from_xml_with`, `vim_response_with`) that do not require this feature.
vcsim_compat = ["xml"]

[dependencies]
base64 = "0.22"
bytes = "1"
env_logger = "0.11"
indexmap = "2.9"
log = "0.4"
miniserde = "0.1"
quick-xml = { version = "0.39", optional = true }
reqwest = { version = "0.12" }
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync"] }
vim_macros = { version = "0.4.4", path = "../vim_macros" }
phf = "0.13"

[build-dependencies]
rustc_version = "0.4"

[lib]
doctest = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "miniserde_bench"
harness = false

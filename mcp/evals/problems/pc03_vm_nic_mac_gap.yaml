id: pc03_vm_nic_mac_gap
pillar: propcollector
mo_type: VirtualMachine
goal: |
  For each virtual machine, collect the MAC address of every Ethernet network
  adapter, in device order. The hardware device list is polymorphic: it mixes
  network adapters of different kinds with non-network devices (e.g. CD-ROMs)
  that have no MAC. Return only the Ethernet adapters' MACs.
contract: |
  // Fill the property path AND implement ethernet_macs().
  // devices is Vec<Box<dyn VirtualDeviceTrait>>; only Ethernet adapter
  // subtypes carry a MAC — you must downcast, not read a base field.
  vim_retrievable!(struct Target: VirtualMachine {
      devices = "<path>",
  });

  /// MAC address of each Ethernet adapter in `t.devices`, in device order.
  pub fn ethernet_macs(t: &Target) -> Vec<String> {
      todo!()
  }
fixtures:
  - file: pc03_a.json
    expected: '[{"mac_addresses":["00:aa:11:22:33:44"]}]'
  - file: pc03_b.json
    expected: '[{"mac_addresses":["00:bb:22:33:44:55"]},{"mac_addresses":["00:cc:33:44:55:66","00:dd:44:55:66:77"]}]'
notes: |
  Full-navigation probe. Correct answer requires:
    path  = config.hardware.device
    field = Vec<Box<dyn VirtualDeviceTrait>>
    cast  = CastInto::into_ref::<dyn VirtualEthernetCardTrait>() per device
    read  = mac_address (Some) ; filter out Cdrom / non-ethernet
  Fixtures mix Cdrom + E1000 + Vmxnet3 so a base-field read won't compile,
  a single-concrete-type match misses Vmxnet3, and no filtering yields Nones.
  The MCP path shorthand encodes this as
  `config.hardware.device[*]→VirtualEthernetCard.macAddress`.

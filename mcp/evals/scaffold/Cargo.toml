[package]
name = "eval_scaffold"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "eval_scaffold"
path = "src/main.rs"

[dependencies]
vim_rs = { path = "../../../vim_rs", features = ["perf"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
bytes = "1"
miniserde = "0.1"

[package]
name = "vim_mcp_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# MCP protocol implementation
rmcp = { version = "0.8.5", features = ["server", "macros"] }
schemars = { version = "1.0", features = ["derive"] }
tokio-util = "0.7.17"

# Embeddings and vector search (optional for semantic search)
fastembed = { version = "5.2.0", optional = true }
lancedb = { version = "0.22.3", optional = true }
arrow-array = { version = "56", optional = true }
arrow-schema = { version = "56", optional = true }
futures = { version = "0.3", optional = true }

# CUDA GPU acceleration (requires CUDA 12.x + cuDNN 9.x runtime)
ort = { version = "2.0.0-rc.7", optional = true, features = ["cuda", "copy-dylibs"] }

[features]
default = ["embeddings"]
embeddings = ["fastembed", "lancedb", "arrow-array", "arrow-schema", "futures"]
cuda = ["embeddings", "ort"]

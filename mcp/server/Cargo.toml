[package]
name = "vim_mcp_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# API database types (shared with build tools)
api_database = { path = "../api_database" }

tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
phf = "0.11"
thiserror = "1.0"
indexmap = { version = "2.0", features = ["serde"] }

# MCP protocol implementation
rmcp = { version = "0.8.5", features = ["server", "macros"] }
schemars = { version = "1.0", features = ["derive"] }
tokio-util = "0.7.17"

# Binary serialization (required for embedded database)
bincode = "1.3"

# Embeddings and vector search (core functionality)
fastembed = "5.2.0"
rayon = "1.10"

# CUDA GPU acceleration (optional, requires CUDA 12.x + cuDNN 9.x runtime)
ort = { version = "2.0.0-rc.7", optional = true, features = ["cuda", "copy-dylibs"] }

[features]
default = []
cuda = ["ort"]

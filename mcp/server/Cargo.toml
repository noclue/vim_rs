[package]
name = "vim_mcp_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# API database types (shared with build tools)
api_database = { path = "../api_database" }

tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
phf = "0.13"
regex = "1.10"
thiserror = "2.0"
indexmap = { version = "2.13", features = ["serde"] }

# MCP protocol implementation
rmcp = { version = "1.4", features = ["server", "macros"] }
schemars = { version = "1.0", features = ["derive"] } # Align to rmcp version
tokio-util = "0.7"

# Binary serialization (required for embedded database)
bincode = "1.3"

# Embeddings and vector search (core functionality)
fastembed = "5.8"
rayon = "1.10"

# GPU / hardware acceleration (optional)
ort = { version = "2.0.0-rc.7", optional = true, features = ["copy-dylibs"] }

# Web UI dependencies (optional, enabled by default)
actix-web = { version = "4.12", optional = true }
actix-files = { version = "0.6", optional = true }
tera = { version = "1.20", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
# Used to download the embedding model during build if not cached
fastembed = "5.8"

[dev-dependencies]
# For end-to-end web UI tests
reqwest = { version = "0.13", features = ["json"] }

[features]
default = ["embed-model", "web-ui"]
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
# Embed the BGE-small-en-v1.5 model directly in the binary (~128MB increase)
# The build script will download the model if not already cached
embed-model = []
# Web UI for testing MCP tools via browser
web-ui = ["actix-web", "actix-files", "tera", "pulldown-cmark"]

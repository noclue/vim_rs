[package]
name = "vim_mcp_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# MCP protocol implementation
rmcp = { version = "0.8.5", features = ["server", "macros"] }
schemars = { version = "1.0", features = ["derive"] }
tokio-util = "0.7.17"

[package]
name = "build-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "build-examples"
path = "src/main.rs"

[dependencies]
vim_mcp_server = { path = ".." }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

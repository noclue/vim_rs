[package]
name = "build-embeddings"
version = "0.1.0"
edition = "2021"

[lib]
name = "build_embeddings"
path = "src/lib.rs"

[dependencies]
api_database = { path = "../../api_database" }
fastembed = "5.8.1"
anyhow = "1.0"
tracing = "0.1"

# CUDA GPU acceleration (optional)
ort = { version = "2.0.0-rc.11", optional = true, features = ["cuda", "copy-dylibs"] }

[features]
default = []
cuda = ["ort"]

[package]
name = "build-api-definitions"
version = "0.1.0"
edition = "2021"

[lib]
name = "build_api_definitions"
path = "src/lib.rs"

[dependencies]
vim_build = { path = "../../../vim_build" }
api_database = { path = "../../api_database" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
convert_case = "0.8"
check_keyword = "0.3"
tracing = "0.1"


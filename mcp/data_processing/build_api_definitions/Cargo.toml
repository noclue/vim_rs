[package]
name = "build-api-definitions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "build-api-definitions"
path = "src/main.rs"

[dependencies]
vim_build = { path = "../../../vim_build" }
vim_mcp_server = { path = "../../server" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
convert_case = "0.8"
check_keyword = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"


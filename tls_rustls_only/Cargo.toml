[package]
name = "tls_rustls_only"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vim_rs = { path = "../vim_rs", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
    "cookies"
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

tokio = { version = "1", features = ["rt"] }
